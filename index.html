<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViOCR · Nhận dạng văn bản tiếng Việt</title><link rel="stylesheet" href="app.css"></head>
<body><main class="window"><header><span class="icon" aria-hidden="true">V</span> ViOCR <span class="title-detail">/ Nhận dạng tiếng Việt</span></header>
<nav><a href="https://github.com/xulytiengviet/ViOCR/blob/main/viocr/README.md">Hướng dẫn Windows</a><a href="codec-demo.html">Bộ giải mã</a><a href="https://github.com/xulytiengviet/ViOCR/tree/main/viocr">Mã nguồn ↗</a></nav>
<section class="body"><h1>Nhận dạng tài liệu</h1><p class="lead">Chọn ảnh hoặc PDF để đọc chữ tiếng Việt ngay trên máy.</p>
<div class="open-row"><div id="drop"><button id="open" class="primary">Mở tài liệu…</button><span>hoặc kéo tệp vào đây</span><input type="file" id="file" hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.gif,.tif,.tiff,.avif"></div>
<label>Chữ trên tài liệu<select id="mode"><option value="unicode">Tiếng Việt Unicode</option><option value="cvss">CVNSS4.0</option><option value="base27">Số nguyên Base27</option></select></label></div>
<div class="docbar"><strong id="name">Chưa mở tài liệu</strong><button id="sample">Thử PDF mẫu</button></div>
<label class="result-label" for="result">Kết quả Unicode</label><textarea id="result" readonly placeholder="Văn bản nhận dạng sẽ hiện ở đây." spellcheck="false"></textarea>
<div class="actions"><button id="word" disabled>Lưu Word (.docx)…</button><button id="txt" disabled>Lưu TXT…</button><button id="jsonl" disabled>Lưu JSONL…</button></div>
<p id="savehelp"></p></section><div class="status"><span id="status" role="status" aria-live="polite">Sẵn sàng</span><progress id="progress" hidden max="1"></progress></div></main>
<footer>Long Ngo phát triển · Dựa trên CVNSS4.0 · <a href="LICENSE">MIT</a></footer>
<script defer src="converter.js"></script><script defer src="codec.js"></script><script type="module" src="app.js"></script>
</body></html>
